# Rime punctuation preset for Microsoft-style direct @ commit.
# encoding: utf-8
---
punctuator:
  full_shape:
    " ": {commit: "　"}
    ",": {commit: "，"}
    .: {commit: "。"}
    "<": ["《", "〈", "«", "‹"]
    ">": ["》", "〉", "»", "›"]
    "/": ["／", "÷"]
    "?": {commit: "？"}
    ";": {commit: "；"}
    ":": {commit: "："}
    "'": {pair: ["‘", "’"]}
    "\"": {pair: ["“", "”"]}
    "\\": ["、", "＼"]
    "|": ["·", "｜", "§", "¦"]
    "`": "｀"
    "~": "～"
    "!": {commit: "！"}
    # Shift+2 should behave like Microsoft Pinyin in every shape mode:
    # commit the ASCII at-sign immediately instead of opening a candidate list.
    "@": {commit: "@"}
    "#": ["＃", "⌘"]
    "%": ["％", "°", "℃"]
    "$": ["￥", "$", "€", "£", "¥", "¢", "¤"]
    "^": {commit: "……"}
    "&": "＆"
    "*": ["＊", "·", "・", "×", "※", "❂"]
    "(": "（"
    ")": "）"
    "-": "－"
    _: "——"
    "+": "＋"
    "=": "＝"
    "[": ["「", "【", "〔", "［"]
    "]": ["」", "】", "〕", "］"]
    "{": ["『", "〖", "｛"]
    "}": ["』", "〗", "｝"]
  half_shape:
    ",": {commit: "，"}
    .: {commit: "。"}
    "<": ["《", "〈", "«", "‹"]
    ">": ["》", "〉", "»", "›"]
    "/": ["、", "/", "／", "÷"]
    "?": {commit: "？"}
    ";": {commit: "；"}
    ":": {commit: "："}
    "'": {pair: ["‘", "’"]}
    "\"": {pair: ["“", "”"]}
    "\\": ["、", "\\", "＼"]
    "|": ["·", "|", "｜", "§", "¦"]
    "`": "`"
    "~": ["~", "～"]
    "!": {commit: "！"}
    "@": {commit: "@"}
    "#": "#"
    "%": ["%", "％", "°", "℃"]
    "$": ["￥", "$", "€", "£", "¥", "¢", "¤"]
    "^": {commit: "……"}
    "&": "&"
    "*": ["*", "＊", "·", "・", "×", "※", "❂"]
    "(": "（"
    ")": "）"
    "-": "-"
    _: "——"
    "+": "+"
    "=": "="
    "[": ["「", "【", "〔", "［"]
    "]": ["」", "】", "〕", "］"]
    "{": ["『", "〖", "｛"]
    "}": ["』", "〗", "｝"]
  symbols:
    __include: symbols:/punctuator/symbols
