  ^(?:ue5|i2v|t2v|v2v|3dcg|4k|8k|sd15|sdxl|wan21|wan22|h264|h265|fp8|fp16|bf16|int8|cfg7|lcm8|lora1|r16x9|r9x16|r1x1|r4x3|r3x4|r21x9)$

